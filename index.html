<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="김정현의 개인 홈페이지" />
    <title>김정현 | Personal Page</title>
    <style>
      :root { --ink: #182235; --muted: #58647a; --paper: #f7f9fc; --card: #fff; --accent-soft: #e8e8ff; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--paper); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.65; }
      main { width: min(960px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 56px; }
      .hero { min-height: 390px; padding: clamp(34px, 7vw, 76px); display: flex; flex-direction: column; justify-content: center; border-radius: 28px; color: white; background: radial-gradient(circle at 88% 13%, #9296ff 0, transparent 28%), linear-gradient(135deg, #24265c, #5b5bd6); box-shadow: 0 20px 50px rgba(39, 42, 122, 0.2); }
      .eyebrow { margin: 0 0 12px; color: #dfe0ff; font-size: 0.96rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(3rem, 8vw, 5.5rem); line-height: 1.05; letter-spacing: -0.055em; }
      .hero p:last-child { max-width: 560px; margin: 24px 0 0; color: #f3f3ff; font-size: clamp(1.05rem, 2.2vw, 1.3rem); }
      .grid { display: grid; grid-template-columns: 1fr 1.45fr; gap: 22px; margin-top: 22px; }
      section { padding: 30px; border: 1px solid #e7eaf0; border-radius: 20px; background: var(--card); }
      h2 { margin: 0 0 14px; font-size: 1.35rem; letter-spacing: -0.025em; }
      p { margin: 0; }
      .tag-list { display: flex; flex-wrap: wrap; gap: 10px; padding: 0; margin: 0; list-style: none; }
      .tag-list li { padding: 7px 12px; border-radius: 999px; color: #4142a2; background: var(--accent-soft); font-size: 0.93rem; font-weight: 650; }
      footer { padding-top: 28px; color: var(--muted); font-size: 0.9rem; text-align: center; }
      @media (max-width: 650px) { main { width: min(100% - 28px, 960px); padding-top: 28px; } .hero { min-height: 340px; border-radius: 22px; } .grid { grid-template-columns: 1fr; } section { padding: 25px; } }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">Personal homepage</p>
        <h1>김정현</h1>
        <p>서울대학교 첨단융합학부에서 새로운 기술과 사람의 가능성을 탐구합니다.</p>
      </header>
      <div class="grid">
        <section>
          <h2>About me</h2>
          <p>뇌인지과학에 관심이 많으며, 최근에는 바이브 코딩을 즐겨 하고 있습니다.</p>
        </section>
        <section>
          <h2>Interests</h2>
          <ul class="tag-list">
            <li>뇌인지과학</li><li>바이브 코딩</li><li>융합 학습</li><li>새로운 기술</li>
          </ul>
        </section>
      </div>
      <footer>© 2026 김정현</footer>
    </main>
  </body>
</html>
